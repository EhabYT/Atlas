<Playbook>
	<Name>EBOS</Name>
	<Username>EBOS</Username>
	<Title>EBOS v1.0.0</Title>
	<ShortDescription>EBOS Playbook for Windows 11</ShortDescription>
	<Description><![CDATA[╭───────────── ⚠️ 𝗖𝗿𝗶𝘁𝗶𝗰𝗮𝗹 ⚠️ ─────────────╮
│         Read the EBOS documentation first.       │
│                https://docs.ebos.net/                 │
╰───────────────────────────────────────╯

EBOS makes your computer snappier and more private with lots of usability improvements.]]></Description>
	<Details>An open and lightweight modification to Windows, designed to optimize performance, privacy and security.</Details>
	<ProgressText><![CDATA[EBOS is currently installing software, copying its configuration folders, and tweaking Windows. If you are not already, we recommend following our documentation.]]></ProgressText>
	<Version>1.0.0</Version>
	<SupportedBuilds>
		<!-- 24H2 -->
		<string>26100</string>
		<!-- 25H2 -->
		<string>26200</string>
	</SupportedBuilds>
	<UpgradableFrom>0.5.0</UpgradableFrom>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>Internet</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>UCPDDisabled</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
	<UniqueId>45424f53-0000-4000-8000-45424f534542</UniqueId>
	<InstallGuide>https://docs.ebos.net/getting-started/installation</InstallGuide>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
	<ProductCode>64</ProductCode>
	<EstimatedMinutes>15</EstimatedMinutes>
	<Git>https://github.com/EBOS/EBOS</Git>
	<Website>https://ebos.net</Website>
	<DonateLink>https://ko-fi.com/ebos</DonateLink>
	<SupportsISO>true</SupportsISO>
	<OOBE>
		<BulletPoints>
			<BulletPoint Icon="Rocket" Title="Performance"
			Description="By removing unnecessary background processes, telemetry, optionally disabling power-saving features and more."/>
			<BulletPoint Icon="Lock" Title="Usability"
			Description="By removing Windows' advertising, and fixing general annoyances, you will have a more enjoyable Windows experience."/>
			<BulletPoint Icon="Privacy" Title="Privacy"
			Description="By eliminating most of Microsoft's notorious tracking, pre-installed apps, and bloatware, EBOS makes Windows private."/>
		</BulletPoints>
		<Internet>Force</Internet>
	</OOBE>
	<ISO>
		<DisableBitLocker>true</DisableBitLocker>
		<DisableHardwareRequirements>true</DisableHardwareRequirements>
	</ISO>
	<FeaturePages>
		<RadioPage IsRequired="true" DefaultOption="defender-enable" Description="Disabling Defender reduces security, and is an option for advanced users only.">
			<TopLine Text="Defender can be toggled in the EBOS folder."/>
			<Options>
				<RadioOption>
					<Text>Enable Defender (recommended)</Text>
					<Name>defender-enable</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable Defender</Text>
					<Name>defender-disable</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://docs.ebos.net/getting-started/post-installation/ebos-folder/security/#defender"/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="mitigations-default" Description="Disabling mitigations reduces security, and could harm performance on modern CPUs.">
			<TopLine Text="Disabling could improve performance on older CPUs."/>
			<Options>
				<RadioOption>
					<Text>Default Windows Mitigations (recommended)</Text>
					<Name>mitigations-default</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable All Mitigations</Text>
					<Name>mitigations-disable</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://docs.ebos.net/getting-started/post-installation/ebos-folder/security/#mitigations"/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="auto-updates-disable" Description="Updates are important for security, you'll get update notifications regardless.">
			<TopLine Text="This can be changed in the EBOS folder later."/>
			<Options>
				<RadioOption>
					<Text>Disable Automatic Windows Updates</Text>
					<Name>auto-updates-disable</Name>
				</RadioOption>
				<RadioOption>
					<Text>Enable Automatic Windows Updates</Text>
					<Name>auto-updates-default</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://docs.ebos.net/getting-started/post-installation/ebos-folder/general-configuration/#automatic-updates"/>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Select the options you would like to use, they can be changed in the EBOS folder later.">
			<Options>
				<CheckboxOption>
					<Text>Disable Hibernation</Text>
					<Name>disable-hibernation</Name>
				</CheckboxOption>
			<CheckboxOption>
				<Text>Maximum Performance (Disable Power Saving)</Text>
				<Name>disable-power-saving</Name>
			</CheckboxOption>
				<CheckboxOption>
					<Text>Disable Core Isolation</Text>
					<Name>disable-core-isolation</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://docs.ebos.net/getting-started/post-installation/ebos-folder/configuration"/>
		</CheckboxPage>
	<CheckboxPage IsRequired="true" Description="Select the optional applications you would like to remove. Most can be reinstalled from the Microsoft Store.">
		<Options>
			<CheckboxOption>
				<Text>Remove Snipping Tool App</Text>
				<Name>remove-snipping-tool</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove Microsoft Edge</Text>
				<Name>uninstall-edge</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Install a Browser</Text>
				<Name>install-another-browser</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove OneDrive</Text>
				<Name>remove-onedrive</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove Microsoft Teams</Text>
				<Name>remove-teams</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove MS Photos (restores classic Photo Viewer)</Text>
				<Name>remove-appx-photos</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove Dev Home</Text>
				<Name>remove-appx-devhome</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove Xbox Apps</Text>
				<Name>remove-appx-xbox</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove 'Your Phone'</Text>
				<Name>remove-appx-yourphone</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove AI Components (Recall &amp; Copilot)</Text>
				<Name>remove-winsxs-ai</Name>
			</CheckboxOption>
		</Options>
		<BottomLine Text="Learn more" Link="https://docs.ebos.net/getting-started/post-installation/ebos-folder/configuration"/>
	</CheckboxPage>
	<CheckboxPage IsRequired="true" Description="Select the appearance and interface options you would like. These can be changed later from the EBOS folder.">
		<Options>
			<CheckboxOption>
				<Text>Apply EBOS Wallpaper</Text>
				<Name>configure-wallpaper</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Enable Dark Mode</Text>
				<Name>configure-darkmode</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Enable Classic Context Menu</Text>
				<Name>configure-lcm</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Disable Transparency Effects (Liquid Glass opaque fallback)</Text>
				<Name>configure-te</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Remove Pinned Items in Start Menu</Text>
				<Name>remove-pinned-items-startmenu</Name>
			</CheckboxOption>
		</Options>
		<BottomLine Text="Learn more" Link="https://docs.ebos.net/getting-started/post-installation/ebos-folder/configuration"/>
	</CheckboxPage>
	<CheckboxPage IsRequired="true" Description="Advanced performance options. Hardware-accelerated GPU scheduling requires a supported GPU and a reboot.">
		<Options>
			<CheckboxOption>
				<Text>Enable Hibernate</Text>
				<Name>enable-hibernation</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Disable Automatic Maintenance</Text>
				<Name>disable-automatic-maintenance</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Hardware-Accelerated GPU Scheduling</Text>
				<Name>enable-hwsch</Name>
			</CheckboxOption>
			<CheckboxOption>
				<Text>Disable Taskbar Animations</Text>
				<Name>configure-explorer-taskbar-animations</Name>
			</CheckboxOption>
		</Options>
		<BottomLine Text="Learn more" Link="https://docs.ebos.net/getting-started/post-installation/ebos-folder/general-configuration"/>
	</CheckboxPage>

	<CheckboxPage IsRequired="true" Description="Would you like to install EBOS Toolbox (BETA)?">
		<Options>
			<CheckboxOption>
				<Text>Install EBOS Toolbox</Text>
				<Name>install-toolbox</Name>
			</CheckboxOption>
		</Options>
	</CheckboxPage>
		<RadioImagePage CheckDefaultBrowser="true" DependsOn="install-another-browser" DefaultOption="browser-brave" Description="Select your preferred browser to install. Browser settings are not modified.">
			<TopLine Text="We do not recommend Chrome for privacy reasons."/>
			<Options>
				<RadioImageOption>
					<Text>Brave</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#131524</GradientTopColor>
					<GradientBottomColor>#3b3e4f</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>LibreWolf</Text>
					<Name>browser-librewolf</Name>
					<FileName>librewolf</FileName>
					<GradientTopColor>#057DB6</GradientTopColor>
					<GradientBottomColor>#86D8FF</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Firefox</Text>
					<Name>browser-firefox</Name>
					<FileName>firefox</FileName>
					<GradientTopColor>#FF3647</GradientTopColor>
					<GradientBottomColor>#FFC742</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Chrome</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#7E7E7E</GradientTopColor>
					<GradientBottomColor>#D0D0D0</GradientBottomColor>
				</RadioImageOption>
			</Options>
			<BottomLine Text="Which is best for me?" Link="https://docs.ebos.net/getting-started/post-installation/software/web-browsers"/>
		</RadioImagePage>
	</FeaturePages>
</Playbook>
