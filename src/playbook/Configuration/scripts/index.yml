privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS Scripts domain — wraps the larger PowerShell
  # utilities in Executables\. script-power runs last
  # on purpose (final power-plan application).
  # =====================================================

  - !task: {path: 'scripts\script-file-associations.yml'}
  - !task: {path: 'scripts\script-core-isolation.yml'}
  - !task: {path: 'scripts\script-mitigations.yml'}
  - !task: {path: 'scripts\script-devices.yml'}
  - !task: {path: 'scripts\script-pfp.yml'}
  - !task: {path: 'scripts\script-clientcbs.yml'}
  # Done last on purpose
  - !task: {path: 'scripts\script-power.yml'}
