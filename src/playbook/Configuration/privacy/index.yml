---
title: Privacy Domain
description: Telemetry, diagnostics, advertising, tracking and data-collection controls
privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS Privacy domain
  #
  # Group policy + registry privacy controls, followed
  # by per-feature privacy tweaks. Windows functionality
  # (Store, updates, sign-in) is intentionally preserved.
  # =====================================================

  # ---------- Policy / registry configuration ----------
  - !writeStatus: {status: 'Configuring privacy policies'}
  - !task: {path: 'privacy\registry\privacy.yml'}
  - !task: {path: 'privacy\registry\app-compat.yml'}
  - !task: {path: 'privacy\registry\cdm.yml'}
  - !task: {path: 'privacy\registry\ceip.yml'}
  - !task: {path: 'privacy\registry\cloud-content.yml'}
  - !task: {path: 'privacy\registry\telemetry.yml'}
  - !task: {path: 'privacy\registry\wer.yml'}
  - !task: {path: 'privacy\registry\disable-logging.yml'}

  # ---------- Per-feature privacy tweaks ----------
  - !writeStatus: {status: 'Applying privacy tweaks'}
  - !task: {path: 'privacy\tweaks\config-app-permissions.yml'}
  - !task: {path: 'privacy\tweaks\config-windows-media-player.yml'}
  - !task: {path: 'privacy\tweaks\disable-activity-feed.yml'}
  - !task: {path: 'privacy\tweaks\disable-app-launch-tracking.yml'}
  - !task: {path: 'privacy\tweaks\disable-experimentation.yml'}
  - !task: {path: 'privacy\tweaks\disable-lockscreen-camera.yml'}
  - !task: {path: 'privacy\tweaks\disable-online-speech-recognition.yml'}
  - !task: {path: 'privacy\tweaks\disable-pca.yml'}
  - !task: {path: 'privacy\tweaks\disable-perf-track.yml'}
  - !task: {path: 'privacy\tweaks\disable-privacy-experience.yml'}
  - !task: {path: 'privacy\tweaks\disable-recall-snap.yml'}
  - !task: {path: 'privacy\tweaks\disable-device-monitoring.yml'}
  - !task: {path: 'privacy\tweaks\disable-rsop-logging.yml'}
  - !task: {path: 'privacy\tweaks\disable-speech-auto-updates.yml'}
  - !task: {path: 'privacy\tweaks\disable-tailored-experiences.yml'}
  - !task: {path: 'privacy\tweaks\disable-user-tracking.yml'}
  - !task: {path: 'privacy\tweaks\disable-web-lang-list-access.yml'}
  - !task: {path: 'privacy\tweaks\disable-win-error-reporting.yml'}
  - !task: {path: 'privacy\tweaks\disallow-ms-accounts.yml'}
  - !task: {path: 'privacy\tweaks\disallow-user-activity-upload.yml'}
  - !task: {path: 'privacy\tweaks\search-settings.yml'}
  - !task: {path: 'privacy\tweaks\disable-windows-feedback.yml'}
  - !task: {path: 'privacy\tweaks\disable-windows-spotlight.yml'}
  - !task: {path: 'privacy\tweaks\disable-screen-capture-hotkey.yml', option: 'remove-snipping-tool'}

  # ---------- Application telemetry ----------
  - !task: {path: 'privacy\tweaks\apps\disable-nvidia-telemetry.yml'}
  - !task: {path: 'privacy\tweaks\apps\disable-office-telemetry.yml'}

  # ---------- Advertising ----------
  - !task: {path: 'privacy\tweaks\advertising\disable-advertising-info.yml'}
  - !task: {path: 'privacy\tweaks\advertising\disable-sync-provider-notifs.yml'}

  # ---------- Cloud sync ----------
  - !task: {path: 'privacy\tweaks\cloud\disable-setting-sync.yml'}
  - !task: {path: 'privacy\tweaks\cloud\disable-suggest-ways-to-finish-setup.yml'}
  - !task: {path: 'privacy\tweaks\cloud\disallow-message-cloud-sync.yml'}

  # ---------- Telemetry ----------
  - !task: {path: 'privacy\tweaks\telemetry\disable-activation-telemetry.yml'}
  - !task: {path: 'privacy\tweaks\telemetry\disable-ceip.yml'}
  - !task: {path: 'privacy\tweaks\telemetry\disable-diagnostic-tracing.yml'}
  - !task: {path: 'privacy\tweaks\telemetry\disable-dotnet-cli-telemetry.yml'}
  - !task: {path: 'privacy\tweaks\telemetry\disable-input-telemetry.yml'}
  - !task: {path: 'privacy\tweaks\telemetry\disallow-data-collection.yml'}
