---
title: Gaming Domain
description: Game Mode, Game Bar, GPU scheduling and input latency optimizations
privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS Gaming domain
  #
  # Gaming-focused configuration. Game Mode stays
  # enabled (recommended by Microsoft), background
  # recording is disabled, and input devices are
  # configured for raw, predictable input.
  # Hardware-accelerated GPU scheduling is opt-in.
  # =====================================================

  # ---------- Game Mode stays enabled (recommended) ----------
  - !writeStatus: {status: 'Configuring Game Mode'}
  - !task: {path: 'gaming\game-mode.yml'}

  # ---------- Game Bar / GameDVR background recording off ----------
  - !writeStatus: {status: 'Disabling Game Bar background recording'}
  - !task: {path: 'gaming\disable-game-bar.yml'}

  # ---------- Input latency ----------
  - !writeStatus: {status: 'Configuring input'}
  - !task: {path: 'gaming\input\disable-mouse-acceleration.yml'}

  # ---------- Hardware-accelerated GPU scheduling (opt-in, requires supported GPU + reboot) ----------
  - !writeStatus: {status: 'Configuring GPU scheduling', option: 'enable-hwsch'}
  - !task: {path: 'gaming\hardware-gpu-scheduling.yml', option: 'enable-hwsch'}
