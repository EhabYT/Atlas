---
title: Game Mode
description: Keeps Windows Game Mode enabled and automatic, as recommended for gaming
privilege: Admin
actions:
  - !registryValue:
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    value: 'AllowGameDVR'
    type: REG_DWORD
    data: '0'
    operation: delete
  # Game Mode itself: ON and automatic (Windows default, recommended)
  - !registryValue:
    path: 'HKCU\Software\Microsoft\GameBar'
    value: 'AllowAutoGameMode'
    type: REG_DWORD
    data: '1'
  - !registryValue:
    path: 'HKCU\Software\Microsoft\GameBar'
    value: 'AutoGameModeEnabled'
    type: REG_DWORD
    data: '1'
