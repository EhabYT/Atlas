---
title: Hardware-Accelerated GPU Scheduling
description: Enables HAGS where the GPU and driver support it. Opt-in, requires a reboot, reversible.
privilege: Admin
actions:
  # ------------------------------------------------------------------
  # Risk: MEDIUM. Enables hardware-accelerated GPU scheduling
  # (HwSchMode = 2). Only effective on GPUs/drivers with HAGS
  # support; otherwise ignored by Windows. Rollback: set to 1.
  # Reviewed with the EBOS Core hardware report
  # (EBOS-Detect.ps1) — GPU capability is detected there.
  # ------------------------------------------------------------------
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers'
    value: 'HwSchMode'
    type: REG_DWORD
    data: '2'
