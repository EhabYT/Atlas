---
title: Windows Domain
description: Debloat, packages, components, services, updates and OS-level configuration
privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS Windows domain
  #
  # Consolidates: OS identity, package removal (Win32,
  # WinSxS, AppX), component removal, the unified
  # services configuration, Windows Update policy,
  # system QoL and debloat into one pipeline.
  # =====================================================

  # ---------- OS identity ----------
  - !writeStatus: {status: 'Configuring OS Info'}
  - !task: {path: 'windows\os-info\edition.yml'}
  - !task: {path: 'windows\os-info\oem-info.yml'}

  # ---------- Package removal ----------
  # (WinSxS component removal is handled natively by windows\components.yml)
  - !writeStatus: {status: 'Removing packages'}
  - !task: {path: 'windows\packages\app-win32.yml'}
  - !task: {path: 'windows\packages\appx.yml'}
  - !task: {path: 'windows\packages\optional-features.yml'}

  # ---------- Component removal (irreversible — fresh installs only) ----------
  - !task: {path: 'windows\components.yml'}

  # ---------- AppX cleanup ----------
  - !task: {path: 'windows\appx.yml'}

  # ---------- Services and drivers (unified authoritative list) ----------
  - !task: {path: 'windows\services.yml'}

  # ---------- Registry fixes ----------
  - !writeStatus: {status: 'Applying registry fixes'}
  - !task: {path: 'windows\registry\fixes.yml'}
  - !task: {path: 'windows\registry\deprovisioned-apps.yml'}
  - !task: {path: 'windows\registry\msi-installer-in-safe-mode.yml'}

  # ---------- Windows Update policy ----------
  - !writeStatus: {status: 'Configuring updates'}
  - !task: {path: 'windows\updates\registry\updates.yml'}
  - !task: {path: 'windows\updates\registry\drivers.yml'}
  - !task: {path: 'windows\updates\registry\ms-store.yml'}
  - !task: {path: 'windows\updates\disable-nagging.yml'}
  - !task: {path: 'windows\updates\disable-insider.yml'}
  - !task: {path: 'windows\updates\disable-msrt-telemetry.yml'}
  - !task: {path: 'windows\updates\disable-feature-updates.yml'}
  - !task: {path: 'windows\updates\disable-auto-updates.yml'}
  - !task: {path: 'windows\updates\disable-auto-reboot.yml'}
  - !task: {path: 'windows\updates\disable-delivery-optimization.yml'}
  - !task: {path: 'windows\updates\disable-store-auto-updates.yml'}

  # ---------- System QoL ----------
  - !writeStatus: {status: 'Configuring system behavior'}
  - !task: {path: 'windows\system\crash-control-qol.yml'}
  - !task: {path: 'windows\system\disable-wpbt.yml'}
  - !task: {path: 'windows\system\disable-settings-tips.yml'}
  - !task: {path: 'windows\system\disable-tips.yml'}
  - !task: {path: 'windows\system\disable-auto-app-archival.yml'}

  # ---------- Debloat ----------
  - !writeStatus: {status: 'Debloating Windows'}
  - !task: {path: 'windows\debloat\config-content-delivery.yml'}
  - !task: {path: 'windows\debloat\disable-reserved-storage.yml'}
  - !task: {path: 'windows\debloat\disable-scheduled-tasks.yml'}
  - !task: {path: 'windows\debloat\hide-unused-security-pages.yml'}
  - !task: {path: 'windows\debloat\config-storage-sense.yml'}

  # ---------- Finalization (file associations, cleanup) ----------
  - !task: {path: 'windows\final.yml'}
  - !task: {path: 'windows\default-folder.yml'}
