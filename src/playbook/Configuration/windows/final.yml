---
title: Configuration
description: Applies final EBOS configuration (filesystem, wallpapers, themes, caches)
privilege: TrustedInstaller
actions:

  # ==================================================================
  # EBOS finalization — all native implementations.
  # Legacy external-tool invocations were replaced with fsutil /
  # registry / PowerShell equivalents; service grouping is handled
  # natively by optimization\system\disable-service-host-split.yml.
  # ==================================================================

  - !writeStatus: {status: "Optimizing NTFS"}
  # Disable last-access timestamp updates (fsutil: 1 = disabled, user managed)
  - !run:
    exe: "fsutil.exe"
    args: "behavior set disablelastaccess 1"
    wait: true
    runas: currentUserElevated
  # Disable 8.3 short-name creation (fsutil: 1 = disabled per volume)
  - !run:
    exe: "fsutil.exe"
    args: "behavior set disable8dot3 1"
    wait: true
    runas: currentUserElevated

  # Disable Memory Compression
  - !powerShell:
    command: 'Disable-MMAgent -mc'

  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Services\Pending\7971f918-a847-4430-9279-4a52d1efe18d', value: 'RegisterWithAU', type: REG_DWORD, data: '0'}

  - !cmd:
    command: 'setx DOTNET_CLI_TELEMETRY_OPTOUT 1'
    runas: currentUserElevated

  - !cmd:
    command: 'setx POWERSHELL_TELEMETRY_OPTOUT 1'
    runas: currentUserElevated

  - !writeStatus: {status: "Removing logs"}
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File CLEANER.ps1'
    weight: 150

  - !writeStatus: {status: "Finalizing process"}
  - !registryValue: {path: 'HKCU\System\GameConfigStore', value: 'GameDVR_FSEBehaviorMode', type: REG_DWORD, data: '0', weight: 70}

  - !powerShell: {command: 'Get-ScheduledTask -TaskPath "\Microsoft\Office\*" | Disable-ScheduledTask'}

  - !run: {exeDir: true, exe: "FINALIZE.cmd", weight: 200}

  - !run:
    exeDir: true
    exe: "STARTMENU.cmd"
    option: "remove-pinned-items-startmenu"
    weight: 100

  - !run:
    exeDir: true
    exe: "assoc-photoviewer.cmd"
    option: "remove-appx-photos"
    weight: 150

  - !cmd:
    exeDir: true
    command: 'robocopy "Wallpapers" "%systemroot%\Web\Wallpaper\EBOS\v2" /E /PURGE /IM /IT /NP'
    ignoreErrors: true

  - !powerShell:
    command: '.\WALLPAPER.ps1 -Mode Desktop -ImagePath $env:systemroot\Web\Wallpaper\EBOS\v2\desktop.jpg'
    exeDir: true
    runas: currentUserElevated
    option: "configure-wallpaper"
    weight: 45

  - !powerShell:
    command: '.\WALLPAPER.ps1 -Mode LockScreen -ImagePath $env:systemroot\Web\Wallpaper\EBOS\v2\lockscreen.jpg'
    exeDir: true
    runas: currentUserElevated
    option: "configure-wallpaper"
    weight: 45

  - !powerShell:
    command: 'Copy-Item -Path .\WALLPAPER.ps1 -Destination "$env:systemroot\Web\Wallpaper\EBOS" -Force'
    exeDir: true
    option: "configure-wallpaper"

  - !powerShell:
    command: 'Copy-Item -Path .\WallpaperStartup.cmd -Destination "$env:systemroot\Web\Wallpaper\EBOS" -Force'
    exeDir: true
    option: "configure-wallpaper"

  # === Themes

  - !powerShell:
    command: '.\\Set-Theme.ps1 -Path (Join-Path $env:SystemRoot "Resources\\Themes\\dark.theme")'
    exeDir: true
    runas: currentUserElevated
    option: "!configure-wallpaper"
    options: ["configure-darkmode"]

  - !powerShell:
    command: ".\\Set-Theme.ps1 -New @{ WallpaperPath = (Join-Path $env:SystemRoot 'Web\\Wallpaper\\EBOS\\v2\\desktop.jpg'); ThemeExportPath = (Join-Path $env:SystemRoot 'Resources\\Themes\\ebos.theme'); SystemMode = 'Light'; AppMode = 'Light' }"
    exeDir: true
    runas: currentUserElevated
    option: "!configure-darkmode"
    options: ["configure-wallpaper"]

  - !powerShell:
    command: ".\\Set-Theme.ps1 -New @{ WallpaperPath = (Join-Path $env:SystemRoot 'Web\\Wallpaper\\EBOS\\v2\\desktop.jpg'); ThemeExportPath = (Join-Path $env:SystemRoot 'Resources\\Themes\\ebos.theme'); SystemMode = 'Dark'; AppMode = 'Dark' }"
    exeDir: true
    runas: currentUserElevated
    option: "configure-darkmode"
    options: ["configure-wallpaper"]


  # Still necessary to set for W10
  ## if dark mode is deselected, then revert to light mode
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '0', option: "configure-darkmode", weight: 70}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '0', option: "configure-darkmode", weight: 50}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '1', option: "!configure-darkmode", weight: 70}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '1', option: "!configure-darkmode", weight: 50}


  - !registryValue:
    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
    value: 'EBOSWallpaperStartup'
    type: REG_SZ
    oobe: only
    data: 'cmd /c "%SystemRoot%\Web\Wallpaper\EBOS\WallpaperStartup.cmd"'
    option: "configure-wallpaper"

  # Necessary to refresh start menu entries etc.
  - !appx: {operation: clearCache, name: '*Client.CBS*'}
  - !appx: {operation: clearCache, name: '*StartMenuExperienceHost*', option: "remove-pinned-items-startmenu"}
  - !appx: {operation: clearCache, name: '*Windows.Search*'}
  - !appx: {operation: clearCache, name: '*TCUI*'}

  # Force update group policy
  - !run:
    exe: "gpupdate.exe"

  - !powerShell:
    command: |
      $explorerProcess = Get-Process -Name explorer -ErrorAction SilentlyContinue
      if ($explorerProcess) {
        Stop-Process -Name explorer -Force
      }
      Start-Process explorer
    runas: currentUserElevated
