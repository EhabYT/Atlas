---
title: Services and Drivers
description: Configures services and drivers to reduce background system resource utilization
onUpgrade: false
privilege: TrustedInstaller
actions:
  # ------------------------------------------------------------------
  # EBOS unified services configuration
  #
  # Consolidates the service lists of both legacy sources (the
  # performance-oriented playbook and the usability-oriented playbook)
  # into one authoritative implementation. Where both sources touched
  # the same service, the safest shared value is used.
  #
  # References:
  # https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-vdi-recommendations-2004
  # https://learn.microsoft.com/en-us/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server
  # https://learn.microsoft.com/en-us/windows/iot/iot-enterprise/optimize/services
  # ------------------------------------------------------------------

  # Back up default Windows services & drivers (used by EBOS Recovery)
  - !powerShell:
    command: |
      .\BACKUP.ps1 -FilePath """$([Environment]::GetFolderPath('Windows'))\EBOSModules\Other\winServices.reg"""
    wait: true
    exeDir: true

  ##############################################################################################
  ## SCRIPTS                                                                                  ##
  ##############################################################################################

  - !writeStatus: {status: 'Disabling File Sharing'}
  - !powerShell:
    command: '.\EBOSModules\Scripts\ScriptWrappers\DisableFileSharing.ps1 -Silent'
    exeDir: true
    wait: true
    runas: currentUserElevated

  - !writeStatus: {status: 'Disabling Location'}
  - !cmd:
    command: '"EBOSDesktop\3. General Configuration\Location\Disable Location (default).cmd" /silent'
    exeDir: true
    wait: true
    runas: currentUserElevated

  - !writeStatus: {status: 'Configuring Indexing'}
  - !cmd:
    command: '"EBOSDesktop\3. General Configuration\Search Indexing\Minimal Search Indexing (default).cmd" /silent'
    exeDir: true
    wait: true
    runas: currentUserElevated

  ##############################################################################################
  ## SERVICES                                                                                 ##
  ##############################################################################################

  - !writeStatus: {status: 'Configuring services'}

    # ------ Microsoft recommendation - 'OK to disable' ------
  - !service: {name: 'OneSyncSvc', operation: change, startup: 4}
  - !service: {name: 'TrkWks', operation: change, startup: 4}
  - !service: {name: 'PcaSvc', operation: change, startup: 4}
  - !service: {name: 'DiagTrack', operation: change, startup: 4}

    # ------ Microsoft recommendation - 'Do not disable' -----
  - !service: {name: 'diagnosticshub.standardcollector.service', operation: change, startup: 4}
  - !service: {name: 'WerSvc', operation: change, startup: 4}

    # ------- Microsoft recommendation - 'No guidance' ------
  - !service: {name: 'wercplsupport', operation: change, startup: 4}
  - !service: {name: 'UCPD', operation: change, startup: 4}
  - !powerShell: {command: "Disable-ScheduledTask -TaskPath '\\Microsoft\\Windows\\AppxDeploymentClient' -TaskName 'UCPD velocity'"}

    # ---- Diagnostics / telemetry ----
  - !service: {name: 'WdiServiceHost', operation: change, startup: 4}
  - !service: {name: 'WdiSystemHost', operation: change, startup: 4}
  - !service: {name: 'Wecsvc', operation: change, startup: 4}
  - !service: {name: 'wisvc', operation: change, startup: 4}
  - !service: {name: 'Telemetry', operation: change, startup: 4}

    # ---- Remote assistance / insider previews ----
  - !service: {name: 'dam', operation: change, startup: 4}

    # ---- Experimental / advanced (kept from legacy performance source) ----
  - !service: {name: 'tcpipreg', operation: change, startup: 4}

    # ---- EdgeUpdate left on Manual: disabling breaks WebView installs via Visual Studio ----
  - !service: {name: 'edgeupdate', operation: change, startup: 3}

    # ---- condrv set to Automatic: fixes error 3489660986 (0xd000003a) ----
  - !service: {name: 'condrv', operation: change, startup: 2}

  ##############################################################################################
  ## DRIVERS                                                                                  ##
  ##############################################################################################

  - !writeStatus: {status: 'Configuring drivers'}

  - !service: {name: 'GpuEnergyDrv', operation: change, startup: 4}
    # NetBios support can be re-enabled with the file sharing script
  - !service: {name: 'NetBT', operation: change, startup: 4}
