---
title: Recovery Domain
description: Backups, restore points, Windows RE and legacy-version rollback handling
privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS Recovery domain
  #
  # Post-change backups and rollback of changes from
  # previous playbook versions. Pre-change backups and
  # the restore point are created by core\backup.yml
  # before any modification is applied.
  # =====================================================

  # ---------- Back up the post-tweak service configuration ----------
  - !writeStatus: {status: 'Backing up services'}
  - !task: {path: 'recovery\backup-services.yml'}

  # ---------- Ensure Windows Recovery Environment is available ----------
  - !writeStatus: {status: 'Verifying Windows RE'}
  - !task: {path: 'recovery\enable-winre.yml'}

  # ---------- Revert changes from previous EBOS versions (upgrade path) ----------
  - !writeStatus: {status: 'Removing outdated changes'}
  - !task: {path: 'recovery\revert-legacy-ebos.yml'}
  - !task: {path: 'recovery\revert-legacy.yml'}
