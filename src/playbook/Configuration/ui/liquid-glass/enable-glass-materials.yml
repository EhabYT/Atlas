---
title: Liquid Glass Materials
description: Enables the EBOS Liquid Glass material system with accessibility-aware fallbacks
privilege: Admin
actions:
  # ==================================================================
  # EBOS Liquid Glass — material foundation
  #
  # Enables the Windows transparency pipeline that the Liquid Glass
  # taskbar, Start and flyout surfaces build upon. The full design
  # language (tokens, materials, quality tiers, motion) is specified
  # in docs/design-system/ and docs/LIQUID-GLASS.md.
  #
  # Fallback chain (enforced by EBOS-Glass.ps1):
  #   Refraction -> Blur + Highlight -> Translucency -> Opaque
  # If the user requests "reduced transparency" (accessibility),
  # EBOS-Glass.ps1 collapses the material to the Opaque fallback.
  # ==================================================================

  # ---------- Transparency pipeline (user-level material switch) ----------
  - !registryValue:
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
    value: 'EnableTransparency'
    type: REG_DWORD
    data: '1'

  # ---------- Acrylic-capable taskbar surface ----------
  # 0 = Transparent/Acrylic taskbar (Liquid Glass surface)
  # 1 = Opaque taskbar (fallback material)
  - !registryValue:
    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    value: 'TaskbarTransparency'
    type: REG_DWORD
    data: '0'
    operation: delete
  # UseOLEDTaskbarTransparency (legacy stronger-blur variant) intentionally absent:
  # EBOS-Glass.ps1 selects the blur intensity via quality tiers instead.

  # ---------- Respect the accessibility contract ----------
  # Windows "Show transparency in Windows" is the single source of truth.
  # EBOS never forces transparency when reduced-transparency is requested;
  # EBOS-Glass.ps1 -Auto detects it and applies the simplified material.
