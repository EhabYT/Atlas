---
title: Liquid Glass Quality (Auto)
description: Selects the Liquid Glass quality tier based on hardware, battery and accessibility
privilege: Admin
actions:
  # ==================================================================
  # GPU-aware / battery-aware / accessibility-aware material quality.
  # EBOS-Glass.ps1 -Auto reads the EBOS Core hardware report and picks:
  #   Ultra          — discrete GPU on AC power, no accessibility limits
  #   High           — capable iGPU or discrete GPU, balanced conditions
  #   Balanced       — default recommendation for most systems
  #   Performance    — low-end GPU or battery saver active
  #   Compatibility  — reduced transparency / reduced motion requested,
  #                    or GPU reported as too weak for blur pipelines
  # The choice is written to HKLM\SOFTWARE\EBOS\Glass\Quality and logged
  # in the EBOS change log. Users can override with EBOS-Glass.ps1
  # -Quality <tier> or from the EBOS Desktop dashboard.
  # ==================================================================
  - !powerShell:
    command: |
      $core = """$([Environment]::GetFolderPath('Windows'))\EBOSModules\Core\EBOS-Glass.ps1"""
      if (Test-Path $core) {
        & $core -Auto -Quiet
      } else {
        Write-Output "EBOS-Glass not present yet (first run) — defaulting to Balanced."
        New-Item -Path 'HKLM:\SOFTWARE\EBOS\Glass' -Force | Out-Null
        New-ItemProperty -Path 'HKLM:\SOFTWARE\EBOS\Glass' -Name 'Quality' -Value 'Balanced' -PropertyType String -Force | Out-Null
      }
      exit 0
    wait: true
