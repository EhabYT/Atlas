---
title: UI Domain
description: Explorer, taskbar, Start, shell, appearance, accessibility and Liquid Glass
privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS UI domain
  #
  # Windows 11-inspired shell experience: Explorer,
  # taskbar, Start menu, shell behavior, appearance,
  # accessibility and the EBOS Liquid Glass material
  # system (see docs/LIQUID-GLASS.md).
  # =====================================================

  # ---------- Explorer / shell registry configuration ----------
  - !writeStatus: {status: 'Configuring Explorer'}
  - !task: {path: 'ui\explorer-registry\explorer.yml'}
  - !task: {path: 'ui\explorer-registry\context-menu.yml'}
  - !task: {path: 'ui\explorer-registry\control-panel.yml'}
