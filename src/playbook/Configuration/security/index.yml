---
title: Security Domain
description: Security hardening, Defender, VBS and remote-access controls
privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS Security domain
  #
  # Security-relevant registry policies and hardening
  # tweaks. Essential Windows security mechanisms
  # (authentication, firewall, security updates) are
  # never sacrificed for theoretical performance.
  # =====================================================

  # ---------- Policy / registry configuration ----------
  - !writeStatus: {status: 'Configuring security policies'}
  - !task: {path: 'security\registry\security.yml'}
  - !task: {path: 'security\registry\vbs.yml'}

  # ---------- Hardening tweaks ----------
  - !writeStatus: {status: 'Applying security tweaks'}
  - !task: {path: 'security\tweaks\block-anonymous-enum-sam.yml'}
  - !task: {path: 'security\tweaks\disable-remote-assistance.yml'}
  # Risk: MEDIUM — weakens the UAC secure desktop. Rationale is documented in
  # docs/SECURITY.md; can be reverted with EBOS Recovery (registry backup).
  - !task: {path: 'security\tweaks\disable-uac-secure-desktop.yml'}
