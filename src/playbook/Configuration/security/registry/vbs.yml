---
title: Configure Security -> Virtualization Based Security
description: Configure VBS
privilege: TrustedInstaller
actions:

  # ==================================================================
  # EBOS option: disable-core-isolation (checkbox in the installer)
  # Risk: MEDIUM — reduces hypervisor-based protections.
  # Native implementation (replaces the legacy external tool):
  #   1. VBS off  2. HVCI (Memory Integrity) off  3. Credential Guard off
  # Rollback: set the values back to 1 and reboot.
  # ==================================================================

  # Disabling VBS improves gaming performance
  # https://support.microsoft.com/en-us/windows/options-to-optimize-gaming-performance-in-windows-11-a255f612-2949-4373-a566-ff6f3f474613
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    value: 'EnableVirtualizationBasedSecurity'
    type: REG_DWORD
    data: '0'
    option: 'disable-core-isolation'

  # Memory Integrity (HVCI)
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
    value: 'Enabled'
    type: REG_DWORD
    data: '0'
    option: 'disable-core-isolation'

  # Credential Guard
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'
    value: 'LsaCfgFlags'
    type: REG_DWORD
    data: '0'
    option: 'disable-core-isolation'
