---
title: EBOS Core — Post-Install Validation
description: Validates networking, audio, GPU, storage, Explorer, taskbar and the Liquid Glass configuration after installation
privilege: Admin
actions:
  # ==================================================================
  # EBOS System Validation (see docs/RECOVERY.md).
  # Produces [PASS]/[FAIL] lines per subsystem and writes
  # %WINDIR%\EBOSModules\Other\validation-report.txt.
  # Failures are logged for EBOS Recovery — they never abort
  # the playbook tail (fail-soft by design).
  # ==================================================================
  - !writeStatus: {status: 'Validating system configuration'}
  - !powerShell:
    command: |
      $core = """$([Environment]::GetFolderPath('Windows'))\EBOSModules\Core\EBOS-Validate.ps1"""
      if (Test-Path $core) {
        & $core -Quiet
      } else {
        Write-Output 'EBOS Core validation script not found; skipping (non-fatal).'
      }
      exit 0
    wait: true
