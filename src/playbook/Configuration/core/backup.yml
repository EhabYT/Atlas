---
title: EBOS Core — Pre-Change Backup
description: Creates a restore point and a full pre-change registry/services backup used by EBOS Recovery
privilege: Admin
actions:
  # ==================================================================
  # Safety net before any system modification:
  #   1. Enables System Restore on the system drive (best effort)
  #   2. Creates a restore point named "EBOS pre-install"
  #   3. Exports HKLM/HKCU baseline + service states to
  #      %WINDIR%\EBOSModules\Backups\<timestamp>\
  # Rollback is provided post-install by EBOS-Rollback.ps1
  # and the "EBOS Desktop -> 0. EBOS Core" folder.
  # ==================================================================
  - !writeStatus: {status: 'Creating pre-change backup'}
  - !powerShell:
    command: |
      $core = """$([Environment]::GetFolderPath('Windows'))\EBOSModules\Core\EBOS-Backup.ps1"""
      if (Test-Path $core) {
        & $core -PreInstall
      } else {
        Write-Output 'EBOS Core backup script not found; skipping (non-fatal).'
      }
      exit 0
    wait: true
