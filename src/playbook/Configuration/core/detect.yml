---
title: EBOS Core — System Detection
description: Detects hardware, Windows build and environment; produces the EBOS system report and compatibility verdict
privilege: Admin
actions:
  # ==================================================================
  # EBOS Core preflight. Produces:
  #   %WINDIR%\EBOSModules\Other\system-report.json  (machine-readable)
  #   %WINDIR%\EBOSModules\Other\system-report.txt   (human-readable)
  # and logs the compatibility verdict (supported build, laptop/desktop,
  # virtualization, GPU class, battery presence) to the EBOS change log.
  # Every EBOS domain can consult this report; EBOS-Glass.ps1 uses it
  # for GPU/battery-aware material quality.
  # ==================================================================
  - !writeStatus: {status: 'Detecting hardware and verifying compatibility'}
  - !powerShell:
    command: |
      $core = """$([Environment]::GetFolderPath('Windows'))\EBOSModules\Core\EBOS-Detect.ps1"""
      if (Test-Path $core) {
        & $core -WriteReport
      } else {
        # Core scripts are copied earlier in this same run; if missing
        # (e.g. partial local build) fail soft — the playbook continues.
        Write-Output 'EBOS Core detection script not found; skipping (non-fatal).'
      }
      exit 0
    wait: true
