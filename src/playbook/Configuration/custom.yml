---
title: EBOS
description: Unified entry point — runs the EBOS Core preflight, all EBOS domains, and the recovery/validation tail
privilege: TrustedInstaller
actions:
  # ==================================================================
  #  EBOS — unified Windows optimization platform
  #
  #  Pipeline (each stage is a domain under Configuration\):
  #    1. Preflight   (hive, files, notifications)
  #    2. Core        (detection, pre-change backup)
  #    3. Windows     (packages, components, services, updates, debloat)
  #    4. Privacy     (telemetry, tracking, advertising, cloud)
  #    5. Security    (hardening, remote access)
  #    6. Optimization (kernel, boot, power, storage, multimedia)
  #    7. Gaming      (Game Mode, Game Bar, input, GPU scheduling)
  #    8. Network     (TCP, SMB, sharing hardening)
  #    9. UI          (Explorer, taskbar, Start, shell, Liquid Glass)
  #   10. Misc        (general QoL)
  #   11. Scripts     (script-backed configuration, power last)
  #   12. Recovery    (post-change backups, legacy reverts)
  #   13. Core tail   (system validation)
  #
  #  Legacy note: this playbook unifies two former projects into one
  #  system. Their functionality lives on in the domains above; there
  #  are no separate products, modes or folders. Attribution for the
  #  integrated third-party components is kept in docs/ATTRIBUTION.md.
  # ==================================================================

  # ------------------------- 1. PREFLIGHT ------------------------- #
  # some changes requires default user access. loading the hive before everything else is required
  - !powerShell:
    command: 'reg load HKU\AME_UserHive_Default C:\Users\Default\NTUSER.DAT'
    oobe: false
    wait: true
  - !writeStatus: { status: "Deleting old EBOS folders" }
  - !powerShell:
    command: '.\STOPFOLDERPROC.ps1'
    exeDir: true
    onUpgrade: true
    wait: true
    runas: currentUserElevated
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      Remove-Item -LiteralPath "$windir\EBOSDesktop" -Force -Recurse
      Remove-Item -LiteralPath "$windir\EBOSModules" -Force -Recurse
    wait: true
    exeDir: true
    oobe: false
    onUpgrade: true

  - !writeStatus: { status: "Copying files" }
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      @(
          'EBOSModules',
          'EBOSDesktop'
      ) | ForEach-Object {
          if (!(Test-Path $_)) { exit 1 }
          Copy-Item -Path $_ -Destination $windir -Force -Recurse
          if (!$?) { exit 2 }
      }
      Start-Process -FilePath """$windir\EBOSDesktop\6. Advanced Configuration\Process Explorer\Uninstall Process Explorer.cmd""" -ArgumentList "/silent" -WindowStyle Hidden
      Copy-Item -Path 'Themes\*' -Destination """$windir\Resources\Themes""" -Force -Recurse
    weight: 10
    wait: true
    exeDir: true
    handleExitCodes: { "!0": halt }

  # Prevent annoying notifications during deployment
  - !cmd:
    command: "DISABLENOTIFS.cmd"
    exeDir: true
    wait: true
    runas: currentUserElevated
  - !taskKill: { name: "explorer" }
  - !taskKill: { name: "ShellExperienceHost" }
  - !run: { exe: "explorer.exe", runas: "currentUser", wait: false }

  # Configure PowerShell first so that other PowerShell scripts work
  # NGEN - .NET assemblies PowerShell optimization
  - !writeStatus: { status: "Optimizing PowerShell" }
  - !task: { path: 'scripts\script-ngen.yml' }
  - !task: { path: 'misc\config-powershell.yml' }

  # Disk Cleanup is run first so it can run in the background
  - !writeStatus: { status: "Cleaning up" }
  - !powerShell:
    command: '.\CLEANUP.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Set hidden Settings pages
  # Done before the domains as their scripts may overwrite it
  - !task: { path: 'windows\set-hidden-settings-pages.yml' }

  # ------------------------- 2. CORE ------------------------------ #
  # Hardware detection, compatibility report, pre-change backup
  - !task: { path: 'core\detect.yml' }
  - !task: { path: 'core\backup.yml' }

  # ------------------------- 3. WINDOWS --------------------------- #
  # Initial environment (PATH, DirectPlay, software), then the
  # Windows domain (packages, components, services, updates, debloat)
  - !task: { path: 'windows\init.yml' }
  - !task: { path: 'windows\index.yml' }

  # ------------------------- 4. PRIVACY --------------------------- #
  - !task: { path: 'privacy\index.yml' }

  # ------------------------- 5. SECURITY -------------------------- #
  - !task: { path: 'security\index.yml' }

  # --------------------- 6. OPTIMIZATION -------------------------- #
  - !task: { path: 'optimization\index.yml' }

  # ------------------------- 7. GAMING ---------------------------- #
  - !task: { path: 'gaming\index.yml' }

  # ------------------------- 8. NETWORK --------------------------- #
  - !task: { path: 'network\index.yml' }

  # ------------------------- 9. UI -------------------------------- #
  - !task: { path: 'ui\index.yml' }

  # ------------------------- 10. MISC ----------------------------- #
  - !task: { path: 'misc\index.yml' }

  # ------------------------- 11. SCRIPTS -------------------------- #
  - !task: { path: 'scripts\index.yml' }

  # ------------------------- 12. RECOVERY ------------------------- #
  - !task: { path: 'recovery\index.yml' }

  # ------------------------- TAIL --------------------------------- #
  # Set hives to HKU default user
  - !writeStatus: { status: "Applying hives..." }
  - !powerShell:
    command: '.\APPLYDUHIVE.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Set all the correct paths if there are incorrect ones in the registry
  - !writeStatus: { status: "Cleaning up registry paths" }
  - !powerShell:
    command: '.\SETPATHS.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Unloading the hive
  - !powerShell:
    command: 'reg unload HKU\AME_UserHive_Default'
    oobe: false
    wait: true

  # Set PowerShell execution policy to RemoteSigned from the previous "Unrestricted"
  # This allows EBOS folder scripts (local) to run while requiring signatures for downloaded scripts
  - !writeStatus: { status: "Securing PowerShell execution policy" }
  - !registryValue:
    path: 'HKLM\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell'
    value: 'ExecutionPolicy'
    data: 'RemoteSigned'
    type: REG_SZ

  # --------------------- 13. CORE TAIL ---------------------------- #
  # Post-install system validation (fail-soft)
  - !task: { path: 'core\validate.yml' }
