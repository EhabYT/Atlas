---
title: Misc Domain
description: General quality-of-life configuration not owned by a specific domain
privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS Misc domain — QoL leftovers that do not belong
  # to a single domain (time, shortcuts, files, OEM info)
  # =====================================================

  - !writeStatus: {status: 'Applying miscellaneous tweaks'}
  - !task: {path: 'misc\config-time.yml'}
  - !task: {path: 'misc\delete-windows-specific-files.yml'}
  - !task: {path: 'misc\rebuild-perf-counters.yml'}
  - !task: {path: 'misc\make-measuresleep-admin.yml'}
  - !task: {path: 'misc\create-shortcuts.yml'}
  - !task: {path: 'misc\add-newUser-script.yml'}
  - !task: {path: 'misc\add-music-videos-to-home.yml'}
  - !task: {path: 'misc\enable-notifications.yml'}
  - !task: {path: 'misc\config-oem-information.yml'}
  - !task: {path: 'misc\add-sharing-settings-shortcut.yml'}
  - !task: {path: 'misc\config-windows-ink-workspace.yml'}
  - !task: {path: 'misc\disable-resume.yml'}
  - !task: {path: 'misc\disable-spell-checking.yml'}
  - !task: {path: 'misc\disable-usb-issues-notifications.yml'}
  - !task: {path: 'misc\remove-efi-drive-letter.yml'}
