---
title: configure-kernel
description: configure-kernel
privilege: TrustedInstaller
actions:

  # === Enable Intel TSX (native implementation)
  # ------> By default it's disabled due to security reasons; Enabling it makes 4~5 times faster
  # ------> in database transactions and around 40% faster in specific workloads.
  # ------> Risk: EXPERIMENTAL — re-enables a feature mitigated for security (CVE mitigations).
  # ------> Rollback: set DisableTsx back to 1 and reboot.
  # https://github.com/meetrevision/playbook/issues/100
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel'
    value: 'DisableTsx'
    type: REG_DWORD
    data: '0'
