---
title: Optimization Domain
description: CPU, memory, storage, boot and responsiveness optimizations
privilege: TrustedInstaller
actions:
  # =====================================================
  # EBOS Optimization domain
  #
  # Kernel, boot, power and multimedia configuration
  # merged from both legacy sources, followed by the
  # performance tweak set. Every change here is
  # reversible and documented in docs/OPTIMIZATION.md.
  # =====================================================

  # ---------- Registry / system configuration ----------
  - !writeStatus: {status: 'Configuring system internals'}
  - !task: {path: 'optimization\registry\boot.yml'}
  - !task: {path: 'optimization\registry\bypass-requirements.yml'}
  - !task: {path: 'optimization\registry\crash-control.yml'}
  - !task: {path: 'optimization\registry\disable-automatic-maintenance.yml'}
  - !task: {path: 'optimization\registry\ifeo.yml'}
  - !task: {path: 'optimization\registry\kernel.yml'}
  - !task: {path: 'optimization\registry\logon.yml'}
  - !task: {path: 'optimization\registry\multimedia.yml'}
  - !task: {path: 'optimization\registry\oobe.yml'}
  - !task: {path: 'optimization\registry\power.yml'}
  - !task: {path: 'optimization\registry\win32ps.yml'}
  - !task: {path: 'optimization\registry\audio-communications-do-nothing.yml'}

  # ---------- Performance tweaks ----------
  - !writeStatus: {status: 'Applying performance tweaks'}
  - !task: {path: 'optimization\config-mmcss.yml'}
  - !task: {path: 'optimization\disable-auto-folder-discovery.yml'}
  - !task: {path: 'optimization\config-automatic-maintenance.yml'}
  - !task: {path: 'optimization\disable-background-apps.yml'}
  - !task: {path: 'optimization\disable-fth.yml'}
  - !task: {path: 'optimization\disable-sleep-study.yml'}
  - !task: {path: 'optimization\respect-power-modes-search.yml'}
  - !task: {path: 'optimization\system\optimize-ntfs.yml'}
  - !task: {path: 'optimization\system\disable-service-host-split.yml'}
  - !task: {path: 'optimization\system\win32-priority-separation.yml'}
  # Paging disable is intentionally disabled (commented) — see docs/OPTIMIZATION.md
  # - !task: {path: 'optimization\system\disable-paging.yml'}

  # ---------- Boot / startup / shutdown ----------
  - !writeStatus: {status: 'Optimizing boot behavior'}
  - !task: {path: 'optimization\boot\decrease-shutdown-time.yml'}
  - !task: {path: 'optimization\boot\disable-startup-delay.yml'}
  # - !task: {path: 'optimization\boot\force-end-shutdown-apps.yml'}
  # - !task: {path: 'optimization\boot\enable-verbose-messages.yml'}

  # ---------- Boot configuration data ----------
  - !task: {path: 'optimization\bcdedit.yml'}
